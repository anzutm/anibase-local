<div class="desktop-titlebar pywebview-drag-region" id="desktopTitlebar" aria-label="Desktop Titlebar">
    <!-- macOS Traffic Light Window Controls (Left) -->
    <div class="desktop-titlebar-controls macos-controls" role="group" aria-label="macOS Window Controls">
        <button type="button" class="macos-btn macos-close" id="desktopBtnCloseMac" title="Close (Ctrl+W)" aria-label="Close">
            <svg class="macos-icon icon-mac-close" viewBox="0 0 12 12" width="6" height="6">
                <path d="M2.2 2.2l7.6 7.6M9.8 2.2L2.2 9.8" stroke="#4c0002" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
        </button>
        <button type="button" class="macos-btn macos-min" id="desktopBtnMinMac" title="Minimize (Win+Down)" aria-label="Minimize">
            <svg class="macos-icon icon-mac-min" viewBox="0 0 12 12" width="6" height="6">
                <path d="M2 6h8" stroke="#5a3800" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
        </button>
        <button type="button" class="macos-btn macos-max" id="desktopBtnMaxMac" title="Maximize / Restore (Win+Up/Down)" aria-label="Maximize or Restore">
            <svg class="macos-icon icon-mac-max" viewBox="0 0 12 12" width="6" height="6">
                <path d="M2.5 4.5l4-2.5v5zM9.5 7.5l-4 2.5v-5z" fill="#024302"/>
            </svg>
            <svg class="macos-icon icon-mac-restore" viewBox="0 0 12 12" width="6" height="6" style="display:none;">
                <path d="M6 2.5L2.5 6l3.5 3.5M6 2.5L9.5 6 6 9.5" stroke="#024302" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <!-- Windows Left Spacer -->
    <div class="desktop-titlebar-spacer win-spacer" aria-hidden="true"></div>

    <div class="desktop-titlebar-center">
        <span class="desktop-titlebar-title" id="desktopTitlebarTitle">
            {%- if watch_display_name -%}
                {{ watch_display_name }}{% if not is_movie and current_episode_display_name %} · {{ current_episode_display_name }}{% endif %}
            {%- elif anime_name -%}
                {{ anime_name }}
            {%- else -%}
                AniBase
            {%- endif -%}
        </span>
    </div>

    <!-- macOS Right Spacer to balance titlebar center -->
    <div class="desktop-titlebar-spacer macos-spacer" aria-hidden="true"></div>

    <!-- Windows Window Controls (Right) -->
    <div class="desktop-titlebar-controls win-controls" role="group" aria-label="Windows Window Controls">
        <button type="button" class="desktop-control-btn btn-min" id="desktopBtnMin" title="Minimize (Win+Down)" aria-label="Minimize">
            <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button type="button" class="desktop-control-btn btn-max" id="desktopBtnMax" title="Maximize / Restore (Win+Up/Down)" aria-label="Maximize or Restore">
            <svg class="icon-max" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
                <rect x="0.6" y="0.6" width="8.8" height="8.8" rx="1.5"/>
            </svg>
            <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1" style="display:none;">
                <path d="M2.5 2.5V1a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-.5.5H7.5"/>
                <rect x="1" y="2.5" width="6.5" height="6.5" rx="1"/>
            </svg>
        </button>
        <button type="button" class="desktop-control-btn btn-close" id="desktopBtnClose" title="Close (Ctrl+W)" aria-label="Close or Minimize to Tray">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                <line x1="1" y1="1" x2="9" y2="9"/>
                <line x1="9" y1="1" x2="1" y2="9"/>
            </svg>
        </button>
    </div>
</div>

<div class="desktop-splash" id="desktopSplash" aria-hidden="true">
    <div class="desktop-splash-content">
        <div class="desktop-splash-logo" aria-hidden="true">A</div>
        <div class="desktop-splash-text">
            <h1 class="desktop-splash-appname">Ani<span>Base</span></h1>
            <p class="desktop-splash-caption">Private Anime Screening Room</p>
        </div>
        <div class="desktop-splash-spinner" aria-hidden="true"></div>
    </div>
</div>

<div class="desktop-zoom-toast" id="desktopZoomToast" aria-live="polite">100%</div>
