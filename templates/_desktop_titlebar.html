<div class="desktop-titlebar pywebview-drag-region" id="desktopTitlebar" aria-label="Desktop Titlebar">
    <div class="desktop-titlebar-left">
        <span class="desktop-titlebar-icon" aria-hidden="true">A</span>
        <span class="desktop-titlebar-appname">AniBase</span>
    </div>
    <div class="desktop-titlebar-center">
        <span class="desktop-titlebar-title" id="desktopTitlebarTitle">
            {%- if watch_display_name -%}
                {{ watch_display_name }}{% if not is_movie and current_episode_display_name %} · {{ current_episode_display_name }}{% endif %}
            {%- elif anime_name -%}
                {{ anime_name }}
            {%- else -%}
                AniBase
            {%- endif -%}
        </span>
    </div>
    <div class="desktop-titlebar-controls" role="group" aria-label="Window Controls">
        <button type="button" class="desktop-control-btn btn-min" id="desktopBtnMin" title="Minimize" aria-label="Minimize">
            <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button type="button" class="desktop-control-btn btn-max" id="desktopBtnMax" title="Maximize / Restore" aria-label="Maximize or Restore">
            <svg class="icon-max" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2">
                <rect x="0.6" y="0.6" width="8.8" height="8.8" rx="1.5"/>
            </svg>
            <svg class="icon-restore" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1" style="display:none;">
                <path d="M2.5 2.5V1a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-.5.5H7.5"/>
                <rect x="1" y="2.5" width="6.5" height="6.5" rx="1"/>
            </svg>
        </button>
        <button type="button" class="desktop-control-btn btn-close" id="desktopBtnClose" title="Minimize to Tray" aria-label="Minimize to System Tray">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                <line x1="1" y1="1" x2="9" y2="9"/>
                <line x1="9" y1="1" x2="1" y2="9"/>
            </svg>
        </button>
    </div>
</div>
