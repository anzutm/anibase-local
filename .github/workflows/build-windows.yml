name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave blank to use APP_VERSION from anibase/constants.py)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build-win64:
    name: Build AniBase Windows (win64 EXE)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}".Trim()
          if (-not $ver -and "${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".Trim()
          }
          if (-not $ver) {
            $ver = python -c "from anibase.constants import APP_VERSION; print(f'v{APP_VERSION}')"
          }
          if (-not $ver.StartsWith("v") -and -not $ver.StartsWith("V")) {
            $ver = "v$ver"
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Target release version: $ver"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install portable FFmpeg & FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg-win64-gpl.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $binDir = (Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).Directory.FullName
          if (-not $binDir) { throw "ffmpeg.exe not found in archive" }
          Write-Output $binDir >> $env:GITHUB_PATH
          & (Join-Path $binDir "ffmpeg.exe") -version | Select-Object -First 1
          & (Join-Path $binDir "ffprobe.exe") -version | Select-Object -First 1

      - name: Pre-build check
        shell: pwsh
        run: python build.py --check

      - name: Build Windows portable EXE release
        shell: pwsh
        run: python build.py "${{ steps.meta.outputs.version }}" --exe-only

      - name: Validate release package and Windows unit tests
        shell: pwsh
        run: python release_check.py

      - name: Smoke-test compiled AniBase.exe and bundled tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.meta.outputs.version }}"
          $releaseDir = "releases\AniBase $ver"
          $exePath = Join-Path $releaseDir "AniBase.exe"
          $ffmpegPath = Join-Path $releaseDir "tools\ffmpeg.exe"
          $ffprobePath = Join-Path $releaseDir "tools\ffprobe.exe"
          foreach ($required in @($exePath, $ffmpegPath, $ffprobePath)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required compiled artifact missing: $required"
            }
          }

          Write-Host "Verifying bundled ffmpeg.exe & ffprobe.exe..."
          $ffOut = & $ffmpegPath -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffmpeg.exe failed with exit code $LASTEXITCODE" }
          $ffOut | Select-Object -First 2
          $fpOut = & $ffprobePath -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe.exe failed with exit code $LASTEXITCODE" }
          $fpOut | Select-Object -First 2

          $tempAppData = Join-Path $env:RUNNER_TEMP "anibase-smoke-appdata"
          New-Item -ItemType Directory -Force -Path $tempAppData | Out-Null
          $stdoutLog = Join-Path $env:RUNNER_TEMP "anibase-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "anibase-stderr.log"

          $prevLocalAppData = $env:LOCALAPPDATA
          $proc = $null
          try {
            $env:LOCALAPPDATA = $tempAppData
            $proc = Start-Process -FilePath (Resolve-Path $exePath) -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

            $ready = $false
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                $errText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
                $appLogPath = Join-Path $tempAppData "AniBase\logs\anibase.log"
                $appLogText = if (Test-Path $appLogPath) { Get-Content $appLogPath -Raw } else { "" }
                throw "AniBase.exe exited prematurely with code $($proc.ExitCode). Stderr: $errText`nApp log: $appLogText"
              }
              try {
                $setupResp = Invoke-WebRequest -Uri "http://127.0.0.1:5000/setup" -UseBasicParsing -TimeoutSec 3
                $statusResp = Invoke-WebRequest -Uri "http://127.0.0.1:5000/api/desktop/status" -UseBasicParsing -TimeoutSec 3
                if ($setupResp.StatusCode -eq 200 -and $statusResp.StatusCode -eq 200) {
                  $statusJson = $statusResp.Content | ConvertFrom-Json
                  if ($statusJson.ok -and $setupResp.Content -match "AniBase") {
                    Write-Host "HTTP /setup OK (len=$($setupResp.Content.Length)), /api/desktop/status ok=$($statusJson.ok)"
                    $ready = $true
                    break
                  }
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $ready) {
              $errText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
              $appLogPath = Join-Path $tempAppData "AniBase\logs\anibase.log"
              $appLogText = if (Test-Path $appLogPath) { Get-Content $appLogPath -Raw } else { "" }
              throw "AniBase.exe did not become HTTP-ready within 30s. Stderr: $errText`nApp log: $appLogText"
            }

            $appLogPath = Join-Path $tempAppData "AniBase\logs\anibase.log"
            if (Test-Path $appLogPath) {
              Write-Host "=== AniBase startup log ==="
              Get-Content $appLogPath -Tail 40
            }
          } finally {
            $env:LOCALAPPDATA = $prevLocalAppData
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Milliseconds 500
            }
          }

      - name: Show build output summary
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          Get-Item "releases\AniBase-$ver-win64.zip" | Format-List Name, Length
          Get-ChildItem "releases\AniBase $ver"

      - name: Upload Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniBase-${{ steps.meta.outputs.version }}-win64
          path: releases/AniBase-${{ steps.meta.outputs.version }}-win64.zip
          if-no-files-found: error
          retention-days: 30
