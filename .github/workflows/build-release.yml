name: Build Dual-Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave blank to use APP_VERSION from anibase/constants.py)"
        required: false
        default: ""
      build_linux:
        description: "Build Linux x86_64 portable ZIP"
        type: boolean
        required: false
        default: true
      build_windows:
        description: "Build Windows x64 portable EXE ZIP"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  resolve-meta:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VER=$(python3 - <<'PY'
          import os
          import build

          raw = (os.environ.get("INPUT_VERSION") or "").strip()
          if not raw and os.environ.get("GITHUB_REF_TYPE") == "tag":
              raw = (os.environ.get("GITHUB_REF_NAME") or "").strip()
          print(build.normalize_version(raw or build.default_version()))
          PY
          )
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Target release version: $VER"

  build-linux:
    name: Build AniBase Linux (x86_64 ZIP)
    needs: resolve-meta
    if: github.event_name == 'push' || inputs.build_linux != false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ needs.resolve-meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            zenity \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libxcb-cursor0 \
            libegl1 \
            libxkbcommon-x11-0 \
            xvfb \
            curl

      - name: Create Python 3.12 venv and install requirements
        run: |
          python3 --version
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Pre-build check
        run: .venv/bin/python build.py --check

      - name: Build Linux portable ZIP release
        run: .venv/bin/python build.py "$RELEASE_VERSION" --exe-only --zip

      - name: Validate release package and Linux unit tests
        run: |
          TMPXDG=$(mktemp -d)
          trap 'rm -rf "$TMPXDG"' EXIT
          HOME="$TMPXDG" XDG_DATA_HOME="$TMPXDG" .venv/bin/python release_check.py

      - name: Smoke-test compiled Linux binary and bundled tools
        run: |
          set -euo pipefail
          RELEASE_DIR="releases/AniBase $RELEASE_VERSION"
          BIN_PATH="$RELEASE_DIR/AniBase"
          test -x "$BIN_PATH"
          "$RELEASE_DIR/tools/ffmpeg" -version | head -n 2
          "$RELEASE_DIR/tools/ffprobe" -version | head -n 2
          ls "$RELEASE_DIR/_internal/gi_typelibs" | grep -E "Gtk-3\.0|WebKit2-"

          SMK_HOME=$(mktemp -d)
          APP_PID=""
          cleanup() {
            if [ -n "$APP_PID" ]; then
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
            rm -rf "$SMK_HOME"
          }
          trap cleanup EXIT

          HOME="$SMK_HOME" XDG_DATA_HOME="$SMK_HOME" GDK_BACKEND=x11 QT_QPA_PLATFORM=offscreen \
            xvfb-run -a "$BIN_PATH" >/tmp/anibase-linux-stdout.log 2>/tmp/anibase-linux-stderr.log &
          APP_PID=$!

          READY=0
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:5000/setup" | grep -q "AniBase" && \
               curl -sf "http://127.0.0.1:5000/api/desktop/status" | grep -q '"ok":true'; then
              echo "Linux HTTP /setup and /api/desktop/status OK"
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            echo "=== Stderr ==="
            cat /tmp/anibase-linux-stderr.log || true
            echo "=== App log ==="
            cat "$SMK_HOME/.local/share/AniBase/logs/anibase.log" || true
            exit 1
          fi

      - name: Show Linux build output summary
        run: |
          ls -lh "releases/AniBase-$RELEASE_VERSION-linux-x86_64.zip"
          ls -lh "releases/AniBase $RELEASE_VERSION"

      - name: Upload Linux portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniBase-${{ needs.resolve-meta.outputs.version }}-linux-x86_64
          path: releases/AniBase-${{ needs.resolve-meta.outputs.version }}-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 30

  build-win64:
    name: Build AniBase Windows (win64 EXE ZIP)
    needs: resolve-meta
    if: github.event_name == 'push' || inputs.build_windows != false
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.resolve-meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install portable FFmpeg & FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg-win64-gpl.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $binDir = (Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).Directory.FullName
          if (-not $binDir) { throw "ffmpeg.exe not found in archive" }
          Write-Output $binDir >> $env:GITHUB_PATH
          & (Join-Path $binDir "ffmpeg.exe") -version | Select-Object -First 1
          & (Join-Path $binDir "ffprobe.exe") -version | Select-Object -First 1

      - name: Pre-build check
        shell: pwsh
        run: python build.py --check

      - name: Build Windows portable EXE ZIP release
        shell: pwsh
        run: python build.py $env:RELEASE_VERSION --exe-only --zip

      - name: Validate release package and Windows unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tempTestData = Join-Path $env:RUNNER_TEMP "anibase-test-appdata"
          New-Item -ItemType Directory -Force -Path $tempTestData | Out-Null
          $prevLocalAppData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = $tempTestData
            python release_check.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:LOCALAPPDATA = $prevLocalAppData
          }

      - name: Smoke-test compiled AniBase.exe and bundled tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:RELEASE_VERSION
          $releaseDir = "releases\AniBase $ver"
          $exePath = Join-Path $releaseDir "AniBase.exe"
          $ffmpegPath = Join-Path $releaseDir "tools\ffmpeg.exe"
          $ffprobePath = Join-Path $releaseDir "tools\ffprobe.exe"
          foreach ($required in @($exePath, $ffmpegPath, $ffprobePath)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required compiled artifact missing: $required"
            }
          }

          Write-Host "Verifying bundled ffmpeg.exe & ffprobe.exe..."
          $ffOut = & $ffmpegPath -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffmpeg.exe failed with exit code $LASTEXITCODE" }
          $ffOut | Select-Object -First 2
          $fpOut = & $ffprobePath -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe.exe failed with exit code $LASTEXITCODE" }
          $fpOut | Select-Object -First 2

          $tempAppData = Join-Path $env:RUNNER_TEMP "anibase-smoke-appdata"
          New-Item -ItemType Directory -Force -Path $tempAppData | Out-Null
          $stdoutLog = Join-Path $env:RUNNER_TEMP "anibase-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "anibase-stderr.log"

          $prevLocalAppData = $env:LOCALAPPDATA
          $proc = $null
          try {
            $env:LOCALAPPDATA = $tempAppData
            $proc = Start-Process -FilePath (Resolve-Path $exePath) -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

            $ready = $false
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                $errText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
                $appLogPath = Join-Path $tempAppData "AniBase\logs\anibase.log"
                $appLogText = if (Test-Path $appLogPath) { Get-Content $appLogPath -Raw } else { "" }
                throw "AniBase.exe exited prematurely with code $($proc.ExitCode). Stderr: $errText`nApp log: $appLogText"
              }
              try {
                $setupResp = Invoke-WebRequest -Uri "http://127.0.0.1:5000/setup" -UseBasicParsing -TimeoutSec 3
                $statusResp = Invoke-WebRequest -Uri "http://127.0.0.1:5000/api/desktop/status" -UseBasicParsing -TimeoutSec 3
                if ($setupResp.StatusCode -eq 200 -and $statusResp.StatusCode -eq 200) {
                  $statusJson = $statusResp.Content | ConvertFrom-Json
                  if ($statusJson.ok -and $setupResp.Content -match "AniBase") {
                    Write-Host "HTTP /setup OK (len=$($setupResp.Content.Length)), /api/desktop/status ok=$($statusJson.ok)"
                    $ready = $true
                    break
                  }
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $ready) {
              $errText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
              $appLogPath = Join-Path $tempAppData "AniBase\logs\anibase.log"
              $appLogText = if (Test-Path $appLogPath) { Get-Content $appLogPath -Raw } else { "" }
              throw "AniBase.exe did not become HTTP-ready within 30s. Stderr: $errText`nApp log: $appLogText"
            }

            $appLogPath = Join-Path $tempAppData "AniBase\logs\anibase.log"
            if (Test-Path $appLogPath) {
              Write-Host "=== AniBase startup log ==="
              Get-Content $appLogPath -Tail 40
            }
          } finally {
            $env:LOCALAPPDATA = $prevLocalAppData
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Milliseconds 500
            }
          }

      - name: Show Windows build output summary
        shell: pwsh
        run: |
          $ver = $env:RELEASE_VERSION
          Get-Item "releases\AniBase-$ver-win64.zip" | Format-List Name, Length
          Get-ChildItem "releases\AniBase $ver"

      - name: Upload Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniBase-${{ needs.resolve-meta.outputs.version }}-win64
          path: releases/AniBase-${{ needs.resolve-meta.outputs.version }}-win64.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach Linux & Windows ZIPs to GitHub Release
    needs: [resolve-meta, build-linux, build-win64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: AniBase-${{ needs.resolve-meta.outputs.version }}-linux-x86_64
          path: dist-release

      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: AniBase-${{ needs.resolve-meta.outputs.version }}-win64
          path: dist-release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist-release/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/*.zip --clobber
          else
            gh release create "$TAG" dist-release/*.zip --title "AniBase $TAG" --generate-notes
          fi
